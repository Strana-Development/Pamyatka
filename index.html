:root {
    --blueberry: #3B2D5E;
    --blueberry-mid: #5A4480;
    --blueberry-light: #8A6FB5;
    --blueberry-pale: #EDE8F5;
    --blueberry-ultra: #F7F5FC;
    --gray-light: #F4F4F6;
    --gray-mid: #E0DDE8;
    --gray-text: #7A7A8A;
    --white: #FFFFFF;
    --text-dark: #1A1228;
    --shadow: 0 2px 20px rgba(59,45,94,0.10);
    --shadow-hover: 0 6px 32px rgba(59,45,94,0.18);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Geologica', sans-serif;
    background: var(--gray-light);
    color: var(--text-dark);
    min-height: 100vh;
    padding: 32px 16px 60px;
  }

  header {
    text-align: center;
    margin-bottom: 0;
  }

  header h1 {
    font-family: 'StranaFont', sans-serif;
    font-size: 2.6rem;
    font-weight: 600;
    color: var(--blueberry);
    letter-spacing: -0.5px;
    line-height: 1.1;
  }

  header p {
    margin-top: 8px;
    font-size: 0.88rem;
    color: var(--gray-text);
    font-weight: 300;
    letter-spacing: 0.3px;
  }

  .card {
    background: var(--white);
    border-radius: 0 0 18px 18px;
    box-shadow: var(--shadow);
    max-width: 720px;
    margin: 0 auto 24px;
    padding: 32px;
  }

  .question-label {
    font-size: 0.72rem;
    font-weight: 500;
    letter-spacing: 1.4px;
    text-transform: uppercase;
    color: var(--blueberry-light);
    margin-bottom: 10px;
  }

  .question-title {
    font-family: 'StranaFont', sans-serif;
    font-size: 1.45rem;
    font-weight: 500;
    color: var(--blueberry);
    margin-bottom: 20px;
  }

  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .option-btn {
    background: var(--blueberry-ultra);
    border: 1.5px solid var(--gray-mid);
    border-radius: 10px;
    padding: 14px 18px;
    text-align: left;
    font-family: 'Geologica', sans-serif;
    font-size: 0.92rem;
    font-weight: 400;
    color: var(--text-dark);
    cursor: pointer;
    transition: all 0.22s ease;
    line-height: 1.4;
  }

  .option-btn:hover {
    background: var(--blueberry-pale);
    border-color: var(--blueberry-light);
    color: var(--blueberry);
    box-shadow: var(--shadow-hover);
    transform: translateY(-1px);
  }

  .option-btn.selected {
    background: var(--blueberry);
    border-color: var(--blueberry);
    color: var(--white);
    box-shadow: 0 4px 18px rgba(59,45,94,0.25);
  }

  .option-btn.selected:hover {
    background: var(--blueberry-mid);
    transform: none;
  }

  /* Result */
  .result-card {
    background: var(--white);
    border-radius: 18px;
    box-shadow: var(--shadow);
    max-width: 720px;
    margin: 0 auto;
    overflow: hidden;
    animation: fadeSlide 0.4s ease;
  }

  @keyframes fadeSlide {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .result-header {
    background: var(--blueberry);
    padding: 28px 32px;
  }

  .result-header h2 {
    font-family: 'StranaFont', sans-serif;
    font-size: 1.55rem;
    font-weight: 600;
    color: var(--white);
    margin-bottom: 4px;
  }

  .result-header .subtitle {
    font-size: 0.8rem;
    color: rgba(255,255,255,0.65);
    letter-spacing: 0.3px;
    font-weight: 300;
  }

  .result-body {
    padding: 32px;
  }

  .doc-section {
    margin-bottom: 28px;
  }

  .doc-section:last-child { margin-bottom: 0; }

  .doc-section-title {
    font-size: 0.70rem;
    font-weight: 500;
    letter-spacing: 1.3px;
    text-transform: uppercase;
    color: var(--blueberry-light);
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--gray-mid);
  }

  .doc-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 7px;
  }

  .doc-list li {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    font-size: 0.9rem;
    color: var(--text-dark);
    line-height: 1.45;
  }

  .doc-list li::before {
    content: '';
    width: 6px;
    height: 6px;
    min-width: 6px;
    border-radius: 50%;
    background: var(--blueberry-light);
    margin-top: 7px;
  }

  .note-box {
    background: var(--blueberry-ultra);
    border-left: 3px solid var(--blueberry-light);
    border-radius: 0 10px 10px 0;
    padding: 14px 16px;
    margin-top: 20px;
    font-size: 0.85rem;
    color: var(--blueberry);
    line-height: 1.55;
  }

  .note-box strong {
    font-weight: 500;
    display: block;
    margin-bottom: 4px;
    font-size: 0.75rem;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  .warning-box {
    background: #FFF8E7;
    border-left: 3px solid #D4A017;
    border-radius: 0 10px 10px 0;
    padding: 14px 16px;
    margin-top: 12px;
    font-size: 0.85rem;
    color: #7A5900;
    line-height: 1.55;
  }

  .warning-box strong {
    font-weight: 500;
    display: block;
    margin-bottom: 4px;
    font-size: 0.75rem;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: #7A5900;
  }

  .reset-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 28px auto 0;
    background: transparent;
    border: 1.5px solid var(--blueberry-light);
    border-radius: 8px;
    padding: 10px 22px;
    font-family: 'Geologica', sans-serif;
    font-size: 0.85rem;
    color: var(--blueberry);
    cursor: pointer;
    transition: all 0.2s;
    font-weight: 400;
  }

  .reset-btn:hover {
    background: var(--blueberry);
    color: white;
    border-color: var(--blueberry);
  }

  .hidden { display: none !important; }

  .tag {
    display: inline-block;
    background: var(--blueberry-pale);
    color: var(--blueberry);
    border-radius: 5px;
    padding: 2px 8px;
    font-size: 0.75rem;
    font-weight: 500;
    margin-right: 4px;
    margin-bottom: 4px;
  }

  .always-note {
    background: var(--blueberry-ultra);
    border: 1.5px dashed var(--blueberry-light);
    border-radius: 12px;
    padding: 16px 18px;
    font-size: 0.82rem;
    color: var(--blueberry);
    line-height: 1.6;
    margin-top: 24px;
  }

  .always-note strong {
    font-size: 0.75rem;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    display: block;
    margin-bottom: 6px;
  }


  .bank-memo-link {
    background: linear-gradient(135deg, var(--blueberry-ultra) 0%, var(--blueberry-pale) 100%);
    border: 1.5px solid var(--blueberry-light);
    border-radius: 12px;
    padding: 20px 22px;
    margin-top: 24px;
    text-align: center;
    transition: all 0.22s ease;
  }

  .bank-memo-link:hover {
    box-shadow: 0 6px 22px rgba(59,45,94,0.16);
    transform: translateY(-1px);
  }

  .bank-memo-title {
    font-family: 'StranaFont', sans-serif;
    font-size: 1.15rem;
    font-weight: 500;
    color: var(--blueberry);
    margin-bottom: 12px;
    letter-spacing: -0.2px;
  }

  .bank-memo-link a {
    display: inline-block;
    background: var(--blueberry);
    color: var(--white);
    text-decoration: none;
    padding: 11px 26px;
    border-radius: 8px;
    font-family: 'Geologica', sans-serif;
    font-size: 0.86rem;
    font-weight: 500;
    letter-spacing: 0.2px;
    transition: background 0.2s ease, box-shadow 0.2s ease;
    box-shadow: 0 2px 10px rgba(59,45,94,0.20);
  }

  .bank-memo-link a:hover {
    background: var(--blueberry-mid);
    box-shadow: 0 4px 16px rgba(59,45,94,0.30);
  }

  .page-wrapper {
    max-width: 720px;
    margin: 0 auto 0;
    filter: drop-shadow(0 4px 24px rgba(59,45,94,0.13));
  }

  .logo-banner {
    border-radius: 18px 18px 0 0;
    overflow: hidden;
    line-height: 0;
    font-size: 0;
  }

  .logo-banner img {
    width: 100%;
    height: auto;
    display: block;
  }

  .page-wrapper header {
    background: var(--white);
    border-radius: 0;
    padding: 22px 32px 20px;
    text-align: center;
    margin-bottom: 0;
    box-shadow: none;
    border-bottom: 1px solid var(--gray-mid);
  }

  /* quiz card directly below header - no gap */
  #quiz-container {
    max-width: 720px;
    margin: 0 auto;
  }

  #result-container {
    max-width: 720px;
    margin: 0 auto;
  }

  /* Override card top margin to connect with header */
  #quiz-container .card {
    border-radius: 0 0 18px 18px;
    margin-top: 0;
    box-shadow: 0 4px 20px rgba(59,45,94,0.12);
  }

  @media (max-width: 600px) {
    body {
      padding: 16px 12px 48px;
    }

    header h1 { font-size: 1.6rem; }
    header p { font-size: 0.82rem; }

    .logo-banner {
      border-radius: 14px 14px 0 0;
    }

    .page-wrapper header {
      padding: 16px 16px 14px;
    }

    .card {
      padding: 18px 14px;
      border-radius: 0 0 14px 14px;
      margin-bottom: 16px;
    }

    .question-title { font-size: 1.2rem; }

    .option-btn {
      font-size: 0.88rem;
      padding: 12px 14px;
    }

    .result-card { border-radius: 14px; }
    .result-header { padding: 20px 16px; }
    .result-header h2 { font-size: 1.25rem; }
    .result-body { padding: 20px 16px; }
    .doc-list li { font-size: 0.85rem; }
    .note-box, .warning-box { font-size: 0.82rem; padding: 12px 14px; }
    .always-note { font-size: 0.80rem; padding: 12px 14px; }
    .reset-btn { font-size: 0.82rem; padding: 9px 18px; }
    .bank-memo-link { padding: 14px 14px; margin-top: 18px; }
    .bank-memo-title { font-size: 1rem; }
    .bank-memo-link a { font-size: 0.82rem; padding: 10px 20px; }
  }

</style>
</head>

let answers = {};
let currentStep = 0;
let stepHistory = [];

function getVisibleQuestions() {
  return questions.filter(q => !q.condition || q.condition(answers));
}

function renderQuiz() {
  const visible = getVisibleQuestions();
  if (currentStep >= visible.length) {
    showResult();
    return;
  }

  const q = visible[currentStep];
  const container = document.getElementById('quiz-container');
  container.innerHTML = '';

  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <div class="question-label">${q.label}</div>
    <div class="question-title">${q.title}</div>
    <div class="options">
      ${q.options.map(o => `
        <button class="option-btn ${answers[q.id] === o.value ? 'selected' : ''}"
          data-value="${o.value}" data-qid="${q.id}">
          ${o.label}
        </button>
      `).join('')}
    </div>
    ${currentStep > 0 ? '<div style="margin-top:20px;text-align:center"><button onclick="goBack()" style="background:none;border:none;color:var(--blueberry-light);font-size:0.82rem;cursor:pointer;text-decoration:underline;font-family:Inter,sans-serif">← Назад</button></div>' : ''}
  `;

  container.appendChild(card);

  card.querySelectorAll('.option-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const qid = btn.dataset.qid;
      const val = btn.dataset.value;
      answers[qid] = val;
      stepHistory.push(currentStep);
      currentStep++;
      renderQuiz();
    });
  });
}

function goBack() {
  if (stepHistory.length === 0) return;
  currentStep = stepHistory.pop();
  // Clear answers after current step
  const visible = getVisibleQuestions();
  for (let i = currentStep; i < visible.length; i++) {
    delete answers[visible[i].id];
  }
  renderQuiz();
}

const PROXY_DOCS = [
  'Номер телефона, электронная почта',
  'Паспорт: 1 стр., страница с регистрацией, страница с семейным положением',
  'СНИЛС',
  'ИНН',
  'Оригинал доверенности',
  'Тождественность к доверенности (обязательно)',
];

function applyProxy(sections, warnings, answers) {
  if (answers.proxy === 'yes') {
    sections.push({ title: 'На доверенное лицо', docs: [...PROXY_DOCS] });
    warnings.push('К доверенности обязательно прилагается тождественность.');
  }
}

  }

  // === Сертификат ===
  if (a.payType === 'cert') {
    let docs = [
      'Паспорт: 1 стр., страница с регистрацией, страница с семейным положением, разворот 18–19 стр.',

    if (a.marital === 'married') {

    const certSections = [
      { title: 'Документы для ДДУ', docs },

      sections: certSections,
      notes: ['Категории: за выслугу лет / переселение из ветхого-аварийного жилья / инвалидность. При «Аварийном жилье» срок выдачи ключей — текущий год. Важно смотреть, на кого выдан сертификат.'],
      warnings: certWarnings
    };
  }

  // === Иностранный гражданин ===
  if (a.citizenship === 'foreign') {
    const docsDDU = [
      'Паспорт',
      'Перевод паспорта (или вид на жительство — кроме Казахстана и Белоруссии)',
      'Документ, подтверждающий право пребывания (патент, миграционная карта и т.д.)',

    ];

      docsDDU.push('СНИЛС', 'ИНН');

    const foreignSections = [
      { title: 'Документы для ДДУ', docs: docsDDU },
      {
        title: 'На подписание',
        docs: ['Паспорт', 'Перевод паспорта', 'Документ, подтверждающий право пребывания']

    applyProxy(foreignSections, foreignWarnings, a);
    return {
      title: 'Иностранный гражданин' + (a.proxy === 'yes' ? ' · доверенность' : ''),
      sections: foreignSections,
      notes: [],
      warnings: foreignWarnings
    };

  // ========================
  // Стандартные сценарии (РФ)
  // ========================
  const isIpoteka = a.payType === 'mortgage';

    ? 'Паспорт — все страницы (включая пустые)'
    : 'Паспорт: 1 стр., страница с регистрацией (при отсутствии постоянной — временная прописка), страница с семейным положением, разворот 18–19 стр.';

  let sections = [];
  let notes = [];
  let warnings = [];

  const basePerPerson = [

    passportDesc,
    'СНИЛС',
    'ИНН',

  const childDocs = [

    'Свидетельство о рождении ребёнка (или справка об инвалидности)',

  // --- ДЕТИ ---
  if (a.participants === 'children') {
    const parentDocs = [...basePerPerson];

      title: 'На подписание',

  // --- 1 УЧАСТНИК холост ---

  }

  // --- Доверенность ---
  applyProxy(sections, warnings, a);

  // Формируем заголовок
  const payLabel = { cash: 'Наличные / Рассрочка', mortgage: 'Ипотека' }[a.payType] || a.payType;
  const maritalLabel = a.marital === 'married' ? 'в браке' : 'холост / не замужем';
  let title = `${payLabel} · гражданин РФ · ${maritalLabel}`;
  if (a.participants === 'children') title += ' · с детьми до 14 лет';
  else if (a.participants === 'shared') title += ' · общедолевая собственность';
  if (a.familyMortgage === 'family') title += ' · семейная ипотека';
  if (a.msk === 'yes') title += ' · МСК';

  if (a.proxy === 'yes') title += ' · доверенность';

  return { title, sections, notes, warnings };
}

function showResult() {
  const data = buildResult();
  document.getElementById('quiz-container').innerHTML = '';
  const container = document.getElementById('result-container');
  container.classList.remove('hidden');

  const isMortgage = answers.payType === 'mortgage';

  container.innerHTML = `
    <div class="result-card">
      <div class="result-header">
        <h2>Пакет документов</h2>
        <div class="subtitle">${data.title}</div>
      </div>
      <div class="result-body">
        ${data.sections.map(s => `
          <div class="doc-section">
            <div class="doc-section-title">${s.title}</div>
            <ul class="doc-list">
              ${s.docs.map(d => `<li>${d}</li>`).join('')}
            </ul>
          </div>
        `).join('')}

        ${data.warnings.length ? data.warnings.map(w => `
          <div class="warning-box"><strong>⚠ Важно</strong>${w}</div>
        `).join('') : ''}

        ${data.notes.length ? data.notes.map(n => `
          <div class="note-box"><strong>ℹ Примечание</strong>${n}</div>
        `).join('') : ''}

        <div class="always-note">
          <strong>📋 Всегда проверять</strong>
          У всех участников сделки номера телефонов и email должны отличаться (кроме детей до 14 лет — указываем номер родителя/матери). При семейной ипотеке свидетельство о рождении ребёнка обязательно!
        </div>

        ${isMortgage ? `
          <div class="bank-memo-link">
            <div class="bank-memo-title">🏦 Памятка документов для Банка</div>
            <a href="https://strana-development.github.io/Pamyatka_Banki/" target="_blank" rel="noopener">Открыть памятку по банкам →</a>
          </div>
        ` : ''}

        <div style="text-align:center">
          <button class="reset-btn" onclick="resetAll()">↩ Начать заново</button>
        </div>
      </div>
    </div>
  `;
}

function resetAll() {
  answers = {};
  currentStep = 0;
  stepHistory = [];
  document.getElementById('result-container').classList.add('hidden');
  document.getElementById('result-container').innerHTML = '';
  renderQuiz();
}

renderQuiz();
</script>
</body>
</html>
